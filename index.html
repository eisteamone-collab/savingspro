<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savings Pro</title>
<style>
:root{--green:#087443;--green-dark:#065b35;--mint:#eaf8f0;--cream:#fbfcf9;--ink:#16352a;--muted:#718078;--line:#e5ebe7;--white:#fff;--orange:#c98019;--red:#b64b49}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
.header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px}.logo{width:37px;height:37px;border-radius:10px;background:var(--green);display:grid;place-items:center;color:#fff;font-size:19px;font-weight:900}.header-links{display:flex;gap:10px;align-items:center}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:750}.primary{background:var(--green);color:#fff}.primary:hover{background:var(--green-dark)}.outline{background:#fff;border:1px solid #cad7cf;color:var(--green)}.danger{background:#fff0ef;color:var(--red)}
.container{max-width:1180px;margin:auto;padding:0 22px}
.hero{min-height:610px;display:grid;place-items:center;text-align:center;padding:70px 20px 75px;background:radial-gradient(circle at 78% 12%,#dff4e8 0,transparent 32%),linear-gradient(#fff,#f8fbf8)}.hero-inner{max-width:850px}.kicker{font-size:12px;letter-spacing:2px;font-weight:850;color:var(--green);margin-bottom:17px}.hero h1{font-family:Georgia,serif;font-size:clamp(43px,6.4vw,72px);line-height:1.04;margin:0 0 20px}.hero p{font-size:18px;line-height:1.7;color:#64736c;max-width:720px;margin:0 auto 28px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);margin-top:55px;background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 18px 50px #16352a0b;overflow:hidden}.hero-stat{padding:23px;border-right:1px solid var(--line)}.hero-stat:last-child{border-right:0}.hero-stat strong{font-size:25px;display:block}.hero-stat span{font-size:12px;color:var(--muted)}
.section{padding:70px 0}.section.alt{background:#fff}.center{text-align:center}.section h2{font-family:Georgia,serif;font-size:36px;margin:0 0 10px}.section-intro{color:var(--muted);max-width:620px;margin:0 auto 35px;line-height:1.7}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.step,.feature{background:#fff;border:1px solid var(--line);border-radius:15px;padding:25px}.step-num{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--green);font-weight:850;margin-bottom:17px}.step h3,.feature h3{margin:0 0 8px;font-size:17px}.step p,.feature p{margin:0;color:var(--muted);line-height:1.65;font-size:14px}.feature-icon{font-size:25px;margin-bottom:12px}.cta{background:var(--green);color:#fff;text-align:center;padding:68px 22px}.cta h2{font-family:Georgia,serif;font-size:39px;margin:0 0 10px}.cta p{opacity:.85;margin:0 auto 25px}.cta .outline{background:transparent;color:#fff;border-color:#ffffff80}.footer{padding:25px;text-align:center;color:#8a9690;font-size:12px;background:#fff}
.login-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:30px;background:linear-gradient(135deg,#eef9f2,#fbfaf6)}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 25px 80px #16352a13}.login-card h1{font-family:Georgia,serif;margin:0 0 8px}.muted{color:var(--muted)}.field{margin:15px 0}.field label{font-size:11px;font-weight:800;display:block;margin-bottom:7px;letter-spacing:.3px}.field input,.field select{width:100%;border:1px solid #d2ddd6;border-radius:9px;padding:12px;outline:0;background:#fff}.field input:focus,.field select:focus{border-color:var(--green);box-shadow:0 0 0 3px #08744312}.error{display:none;color:var(--red);font-size:13px;margin:8px 0}.app{min-height:100vh}.app-body{display:flex;min-height:calc(100vh - 72px)}.side{width:235px;background:#fff;border-right:1px solid var(--line);padding:20px 13px;position:fixed;top:72px;bottom:0}.side small{display:block;color:#9aa59f;text-transform:uppercase;letter-spacing:1.3px;font-size:9px;padding:8px 11px 10px}.nav{display:flex;flex-direction:column;gap:3px}.nav button{border:0;background:transparent;text-align:left;border-radius:9px;padding:11px;color:#5e7168;font-weight:650}.nav button:hover,.nav button.active{background:var(--mint);color:var(--green)}.content{margin-left:235px;width:calc(100% - 235px);padding:28px}.content-inner{max-width:1180px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}.page-head h1{margin:0;font-size:29px}.page-head p{margin:5px 0 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px}.label{font-size:12px;color:var(--muted)}.value{font-size:26px;font-weight:850;margin:8px 0}.grid2{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.mt{margin-top:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;white-space:nowrap}.table th{font-size:11px;color:#7b8982;text-transform:uppercase;letter-spacing:.4px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--mint);color:var(--green);font-size:10px;font-weight:800}.badge.pending{background:#fff6e7;color:var(--orange)}.badge.failed{background:#fff0ef;color:var(--red)}.empty{text-align:center;padding:35px;color:var(--muted)}.summary{display:grid;gap:13px}.summary-row{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:11px}.summary-row:last-child{border:0}.notice{background:#eff9f3;border:1px solid #cce8d8;border-radius:11px;padding:13px;color:#28654a;font-size:13px;line-height:1.55}.wallet{background:linear-gradient(135deg,var(--green),#0c8650);color:#fff;border-radius:16px;padding:25px;min-height:160px;display:flex;flex-direction:column;justify-content:space-between}.wallet .label{color:#d7efe2}.wallet .value{font-size:39px}.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.modal-bg{position:fixed;inset:0;background:#0b251b99;display:grid;place-items:center;padding:20px;z-index:100}.modal{background:#fff;border-radius:17px;width:min(560px,100%);padding:25px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:50%;width:32px;height:32px;background:#f1f4f2}.toast{position:fixed;right:20px;bottom:20px;background:#16352a;color:#fff;padding:12px 15px;border-radius:9px;display:none;z-index:200;font-size:13px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid2,.profile-grid{grid-template-columns:1fr}.hero-stats{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}.feature-grid{grid-template-columns:1fr}}
@media(max-width:650px){.header{padding:0 14px}.header-links .hide-mobile{display:none}.side{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:7px;overflow:auto}.side small{display:none}.nav{flex-direction:row;white-space:nowrap}.app-body{display:block}.content{margin:0;width:100%;padding:17px}.cards{grid-template-columns:1fr 1fr}.page-head{flex-direction:column}.hero-stats{margin-top:35px}.hero{padding-top:45px}.section{padding:50px 0}}
</style>
</head>
<body><div id="root"></div><div id="toast" class="toast"></div>
<script>
const state={
 page:"Landing", user:null,
 users:[
  {id:1,name:"Tan",username:"Tan",password:"heyhey",role:"Admin",balance:0,loaded:0,gcash:"",status:"Active",joined:"2026-01-10"},
  {id:2,name:"Juan Dela Cruz",username:"juan",password:"demo",role:"Member",balance:4250,loaded:5000,gcash:"09171234567",status:"Active",joined:"2026-02-03"},
  {id:3,name:"Maria Santos",username:"maria",password:"demo",role:"Member",balance:1850,loaded:2500,gcash:"09181234567",status:"Active",joined:"2026-02-14"},
  {id:4,name:"Pedro Reyes",username:"pedro",password:"demo",role:"Member",balance:900,loaded:1500,gcash:"09201234567",status:"Active",joined:"2026-03-01"}
 ],
 withdrawals:[
  {id:"WD-1001",user:"Juan Dela Cruz",amount:750,gcash:"09171234567",status:"Paid",date:"2026-08-12"},
  {id:"WD-1002",user:"Maria Santos",amount:500,gcash:"09181234567",status:"Pending",date:"2026-08-20"},
  {id:"WD-1003",user:"Pedro Reyes",amount:300,gcash:"09201234567",status:"Paid",date:"2026-09-03"}
 ],
 loads:[
  {id:"LD-1001",user:"Juan Dela Cruz",amount:5000,date:"2026-08-01"},
  {id:"LD-1002",user:"Maria Santos",amount:2500,date:"2026-08-05"},
  {id:"LD-1003",user:"Pedro Reyes",amount:1500,date:"2026-08-18"}
 ]
};
function peso(n){return "₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:0,maximumFractionDigits:2})}
function save(){localStorage.setItem("savings_pro_demo",JSON.stringify({users:state.users,withdrawals:state.withdrawals,loads:state.loads}))}
function load(){try{const x=JSON.parse(localStorage.getItem("savings_pro_demo"));if(x)Object.assign(state,x)}catch{}}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function header(auth=false){return `<header class="header"><a class="brand" href="#" onclick="go('Landing');return false"><span class="logo">S</span>Savings Pro</a>${auth?`<div class="header-links"><span class="muted">${state.user.role}</span><button class="btn outline" onclick="logout()">Log Out</button></div>`:`<div class="header-links"><button class="btn outline hide-mobile" onclick="go('Login')">Log In</button><button class="btn primary" onclick="go('Register')">Sign Up</button></div>`}</header>`}
function landing(){
return `${header()}<main><section class="hero"><div class="hero-inner"><div class="kicker">SAVE YOUR BUDGET MORE</div><h1>Save Smart with Savings Pro</h1><p>A simple savings wallet loaded by the admin. Track your balance, request withdrawals to GCash, and watch your savings grow — no codes, no levels, just savings.</p><div class="actions"><button class="btn primary" onclick="go('Register')">Get Started Free</button><button class="btn outline" onclick="go('Login')">Log In to My Wallet</button></div><div class="hero-stats"><div class="hero-stat"><strong>1,200+</strong><span>Active Members</span></div><div class="hero-stat"><strong>₱5M+</strong><span>Total Saved</span></div><div class="hero-stat"><strong>₱300</strong><span>Min Withdrawal</span></div><div class="hero-stat"><strong>GCash</strong><span>Payout Method</span></div></div></div></section>
<section class="section"><div class="container center"><h2>How Savings Pro Works</h2><p class="section-intro">Three simple steps to start saving.</p><div class="steps">${step(1,"Create Your Account","Sign up and complete your profile with your GCash details.")}${step(2,"Admin Loads Your Wallet","The admin funds your savings wallet. Your balance updates instantly.")}${step(3,"Withdraw Anytime","Request a withdrawal and receive it straight to your GCash account.")}</div></div></section>
<section class="section alt"><div class="container center"><h2>Why Choose Savings Pro?</h2><p class="section-intro">Everything you need to manage your savings in one place.</p><div class="feature-grid">${feature("◉","Your Savings Wallet","Track your savings balance in one simple wallet. Every load from the admin shows up instantly.")}${feature("＋","Admin-Loaded Savings","Your wallet is funded by the admin — no codes, no levels, just straightforward savings.")}${feature("₱","GCash Withdrawals","Request a withdrawal anytime and receive it straight to your GCash account.")}${feature("✓","Secure & Simple","A clean, secure wallet experience focused only on your savings and withdrawals.")}</div></div></section>
<section class="cta"><h2>Ready to Start Saving?</h2><p>Join hundreds of members already growing their savings with Savings Pro.</p><button class="btn outline" onclick="go('Register')">Create Free Account</button></section></main><footer class="footer">© 2026 Savings Pro. All rights reserved.</footer>`;
}
function step(n,t,d){return `<div class="step"><div class="step-num">${n}</div><h3>${t}</h3><p>${d}</p></div>`}
function feature(i,t,d){return `<div class="feature"><div class="feature-icon">${i}</div><h3>${t}</h3><p>${d}</p></div>`}
function login(){
return `${header()}<div class="login-wrap"><div class="login-card"><div class="brand" style="margin-bottom:22px"><span class="logo">S</span>Savings Pro</div><h1>Member Login</h1><p class="muted">Access your savings wallet and account.</p><form onsubmit="event.preventDefault();loginAction()"><div class="field"><label>USERNAME</label><input id="loginUser" required placeholder="Enter username"></div><div class="field"><label>PASSWORD</label><input id="loginPass" type="password" required placeholder="Enter password"></div><div id="loginError" class="error">Invalid username or password.</div><button class="btn primary" style="width:100%;margin-top:7px">Log In</button></form><p style="font-size:12px;text-align:center;margin:18px 0 0">New here? <a href="#" style="color:var(--green);font-weight:700" onclick="go('Register');return false">Create an account</a></p></div></div>`;
}
function register(){
return `${header()}<div class="login-wrap"><div class="login-card"><h1>Create Your Account</h1><p class="muted">Start your Savings Pro wallet.</p><form onsubmit="event.preventDefault();registerAction()"><div class="field"><label>FULL NAME</label><input id="rName" required></div><div class="field"><label>USERNAME</label><input id="rUser" required></div><div class="field"><label>PASSWORD</label><input id="rPass" type="password" required></div><div class="field"><label>GCASH NUMBER</label><input id="rGcash" inputmode="numeric" placeholder="09XXXXXXXXX" required></div><button class="btn primary" style="width:100%">Create Account</button></form><p style="font-size:12px;text-align:center">Already a member? <a href="#" style="color:var(--green);font-weight:700" onclick="go('Login');return false">Log in</a></p></div></div>`;
}
function sideNav(){
let items=state.user.role==="Admin"?["Dashboard","Members","Wallet Loads","Withdrawals","Monitoring","Profile"]:["Dashboard","Earnings","Withdrawals","Profile"];
return `<aside class="side"><small>Savings Pro</small><nav class="nav">${items.map(x=>`<button class="${state.page===x?'active':''}" onclick="go('${x}')">${navIcon(x)} ${x}</button>`).join("")}</nav></aside>`
}
function navIcon(x){return ({Dashboard:"▦",Members:"♙","Wallet Loads":"＋",Withdrawals:"↗",Monitoring:"◉",Earnings:"₱",Profile:"○"})[x]||"•"}
function appShell(){return `${header(true)}<div class="app-body">${sideNav()}<main class="content"><div class="content-inner">${page()}</div></main></div>`}
function metric(l,v,s){return `<div class="card"><div class="label">${l}</div><div class="value">${v}</div><div class="label">${s}</div></div>`}
function page(){
switch(state.page){
case"Dashboard":return dashboard();
case"Earnings":return earnings();
case"Withdrawals":return withdrawals();
case"Members":return members();
case"Wallet Loads":return loads();
case"Monitoring":return monitoring();
case"Profile":return profile();
default:return dashboard();
}}
function dashboard(){
if(state.user.role==="Admin")return adminDashboard();
return `<div class="page-head"><div><h1>My Savings</h1><p>Welcome back, ${state.user.name}.</p></div><button class="btn primary" onclick="withdrawModal()">Request Withdrawal</button></div><div class="grid2"><div class="wallet"><div><div class="label">AVAILABLE BALANCE</div><div class="value">${peso(state.user.balance)}</div></div><div style="font-size:12px;opacity:.85">Savings wallet · GCash withdrawals</div></div><div class="card"><h3 style="margin-top:0">Account Summary</h3><div class="summary">${row("Total loaded",peso(state.user.loaded))}${row("Total withdrawn",peso(totalWithdrawn(state.user.name)))}${row("Minimum withdrawal",peso(300))}${row("GCash",state.user.gcash||"Not set")}</div></div></div><div class="card mt"><h3 style="margin-top:0">Recent Activity</h3>${activityTable(state.user.name)}</div>`;
}
function adminDashboard(){
return `<div class="page-head"><div><h1>Admin Dashboard</h1><p>Manage savings wallets, loads, and withdrawals.</p></div><button class="btn primary" onclick="loadModal()">Load Wallet</button></div><div class="cards">${metric("Total Members",state.users.filter(u=>u.role==="Member").length,"Registered members")}${metric("Total Saved",peso(state.users.reduce((a,u)=>a+(u.balance||0),0)),"Current member balances")}${metric("Pending Withdrawals",state.withdrawals.filter(w=>w.status==="Pending").length,"Awaiting review")}${metric("Total Loaded",peso(state.users.reduce((a,u)=>a+(u.loaded||0),0)),"Wallet funding")}</div><div class="grid2 mt"><div class="card"><h3 style="margin-top:0">Recent Wallet Loads</h3>${loadTable(5)}</div><div class="card"><h3 style="margin-top:0">Withdrawal Requests</h3>${withdrawTable(5)}</div></div>`;
}
function row(a,b){return `<div class="summary-row"><span class="label">${a}</span><b>${b}</b></div>`}
function totalWithdrawn(name){return state.withdrawals.filter(w=>w.user===name&&w.status!=="Rejected").reduce((a,w)=>a+w.amount,0)}
function activityTable(name){let rows=state.withdrawals.filter(w=>w.user===name);return `<div class="table-wrap"><table class="table"><tr><th>Reference</th><th>Amount</th><th>Status</th><th>Date</th></tr>${rows.map(w=>`<tr><td>${w.id}</td><td>${peso(w.amount)}</td><td>${badge(w.status)}</td><td>${w.date}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No activity yet.</td></tr>`}</table></div>`}
function earnings(){return `<div class="page-head"><div><h1>Earnings</h1><p>Your savings and wallet funding history.</p></div></div><div class="cards">${metric("Current Balance",peso(state.user.balance),"Available savings")}${metric("Total Loaded",peso(state.user.loaded),"All admin wallet loads")}${metric("Withdrawn",peso(totalWithdrawn(state.user.name)),"Completed/requested")}${metric("Min Withdrawal",peso(300),"Minimum request")}</div><div class="card mt"><h3 style="margin-top:0">Wallet Loads</h3>${loadTable(20,state.user.name)}</div>`}
function withdrawals(){let rows=state.user.role==="Admin"?state.withdrawals:state.withdrawals.filter(w=>w.user===state.user.name);return `<div class="page-head"><div><h1>Withdrawals</h1><p>Request and track GCash payouts.</p></div>${state.user.role==="Member"?`<button class="btn primary" onclick="withdrawModal()">Request Withdrawal</button>`:""}</div><div class="card"><div class="notice" style="margin-bottom:15px">Minimum withdrawal is ${peso(300)}. Payout method: GCash.</div>${withdrawTable(30,rows)}</div>`}
function badge(s){return `<span class="badge ${s==="Pending"?"pending":s==="Rejected"?"failed":""}">${s}</span>`}
function withdrawTable(limit=20,rows=state.withdrawals){return `<div class="table-wrap"><table class="table"><tr><th>Reference</th><th>Member</th><th>Amount</th><th>GCash</th><th>Status</th><th>Date</th><th></th></tr>${rows.slice(0,limit).map(w=>`<tr><td>${w.id}</td><td>${w.user}</td><td><b>${peso(w.amount)}</b></td><td>${w.gcash}</td><td>${badge(w.status)}</td><td>${w.date}</td><td>${state.user.role==="Admin"&&w.status==="Pending"?`<button class="btn primary" style="padding:7px 10px;font-size:11px" onclick="pay('${w.id}')">Mark Paid</button>`:""}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">No withdrawal records.</td></tr>`}</table></div>`}
function loadTable(limit=20,userName=null){let rows=state.loads.filter(x=>!userName||x.user===userName).slice(0,limit);return `<div class="table-wrap"><table class="table"><tr><th>Reference</th><th>Member</th><th>Amount</th><th>Date</th></tr>${rows.map(x=>`<tr><td>${x.id}</td><td>${x.user}</td><td><b>${peso(x.amount)}</b></td><td>${x.date}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No wallet loads.</td></tr>`}</table></div>`}
function members(){return `<div class="page-head"><div><h1>Members</h1><p>Manage registered Savings Pro members.</p></div><button class="btn primary" onclick="addMember()">Add Member</button></div><div class="card">${`<div class="table-wrap"><table class="table"><tr><th>Member</th><th>Username</th><th>GCash</th><th>Balance</th><th>Loaded</th><th>Status</th><th></th></tr>`+state.users.filter(u=>u.role==="Member").map(u=>`<tr><td><b>${u.name}</b></td><td>${u.username}</td><td>${u.gcash}</td><td>${peso(u.balance)}</td><td>${peso(u.loaded)}</td><td>${badge(u.status)}</td><td><button class="btn outline" style="padding:7px 10px;font-size:11px" onclick="loadSpecific('${u.username}')">Load Wallet</button></td></tr>`).join("")+`</table></div>`}</div>`}
function loads(){return `<div class="page-head"><div><h1>Wallet Loads</h1><p>Admin-funded savings wallet transactions.</p></div><button class="btn primary" onclick="loadModal()">Load Wallet</button></div><div class="card">${loadTable(50)}</div>`}
function monitoring(){return `<div class="page-head"><div><h1>Monitoring</h1><p>Overview of Savings Pro activity.</p></div></div><div class="cards">${metric("System","Online","Application status")}${metric("Members",state.users.filter(u=>u.role==="Member").length,"Active accounts")}${metric("Pending",state.withdrawals.filter(w=>w.status==="Pending").length,"Withdrawal requests")}${metric("GCash","Enabled","Payout method")}</div><div class="card mt"><h3 style="margin-top:0">System Notes</h3><div class="summary">${row("Wallet model","Admin loaded")}${row("Withdrawal method","GCash")}${row("Minimum withdrawal",peso(300))}${row("Commission levels","None")}</div></div>`}
function profile(){return `<div class="page-head"><div><h1>My Profile</h1><p>Update your account and GCash information.</p></div></div><div class="profile-grid"><div class="card"><h3 style="margin-top:0">Profile Details</h3><div class="field"><label>FULL NAME</label><input id="pName" value="${state.user.name}"></div><div class="field"><label>USERNAME</label><input value="${state.user.username}" disabled></div><div class="field"><label>GCASH NUMBER</label><input id="pGcash" value="${state.user.gcash||""}"></div><button class="btn primary" onclick="saveProfile()">Save Changes</button></div><div class="card"><h3 style="margin-top:0">Account</h3><div class="summary">${row("Role",state.user.role)}${row("Status",state.user.status)}${row("Joined",state.user.joined)}${row("Available balance",peso(state.user.balance))}</div></div></div>`}
function modal(content){return `<div class="modal-bg" id="modal"><div class="modal">${content}</div></div>`}
function loadModal(user=state.users.find(u=>u.role==="Member")){if(!user)return;document.body.insertAdjacentHTML("beforeend",modal(`<div class="modal-head"><h2>Load Wallet</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Add savings directly to a member's wallet.</p><div class="field"><label>MEMBER</label><select id="loadUser">${state.users.filter(u=>u.role==="Member").map(u=>`<option value="${u.username}" ${u.username===user.username?"selected":""}>${u.name} — ${u.username}</option>`).join("")}</select></div><div class="field"><label>AMOUNT</label><input id="loadAmount" type="number" min="1" placeholder="0"></div><button class="btn primary" onclick="submitLoad()">Load Wallet</button>`))}
function withdrawModal(){document.body.insertAdjacentHTML("beforeend",modal(`<div class="modal-head"><h2>Request Withdrawal</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Withdraw to your registered GCash number.</p><div class="notice">Available balance: <b>${peso(state.user.balance)}</b><br>Minimum withdrawal: <b>${peso(300)}</b></div><div class="field"><label>AMOUNT</label><input id="wdAmount" type="number" min="300" max="${state.user.balance}" placeholder="300"></div><button class="btn primary" onclick="submitWithdrawal()">Submit Request</button>`))}
function closeModal(){document.getElementById("modal")?.remove()}
function submitLoad(){let u=state.users.find(x=>x.username===document.getElementById("loadUser").value),a=Number(document.getElementById("loadAmount").value);if(!u||!a||a<=0){toast("Enter a valid amount.");return}u.balance+=a;u.loaded+=a;state.loads.unshift({id:"LD-"+(1001+state.loads.length),user:u.name,amount:a,date:new Date().toISOString().slice(0,10)});save();closeModal();render();toast(`${peso(a)} loaded to ${u.name}.`)}
function submitWithdrawal(){let a=Number(document.getElementById("wdAmount").value);if(a<300||a>state.user.balance){toast("Enter a valid withdrawal amount.");return}let u=state.users.find(x=>x.id===state.user.id);u.balance-=a;state.user=u;state.withdrawals.unshift({id:"WD-"+(1001+state.withdrawals.length),user:u.name,amount:a,gcash:u.gcash,status:"Pending",date:new Date().toISOString().slice(0,10)});save();closeModal();render();toast("Withdrawal request submitted.")}
function pay(id){let w=state.withdrawals.find(x=>x.id===id);if(w){w.status="Paid";save();render();toast("Withdrawal marked as paid.")}}
function addMember(){let n=prompt("Full name:");if(!n)return;let u=prompt("Username:",n.toLowerCase().replace(/\s+/g,""));if(!u)return;let g=prompt("GCash number:","09");if(!g)return;if(state.users.some(x=>x.username===u)){toast("Username already exists.");return}state.users.push({id:Math.max(...state.users.map(x=>x.id))+1,name:n,username:u,password:"demo",role:"Member",balance:0,loaded:0,gcash:g,status:"Active",joined:new Date().toISOString().slice(0,10)});save();render();toast("Member created.")}
function loadSpecific(u){loadModal(state.users.find(x=>x.username===u))}
function saveProfile(){let u=state.users.find(x=>x.id===state.user.id);u.name=document.getElementById("pName").value.trim()||u.name;u.gcash=document.getElementById("pGcash").value.trim();state.user=u;save();render();toast("Profile updated.")}
function loginAction(){let u=document.getElementById("loginUser").value.trim(),p=document.getElementById("loginPass").value,found=state.users.find(x=>x.username===u&&x.password===p);if(!found){document.getElementById("loginError").style.display="block";return}state.user=found;state.page="Dashboard";render();toast("Welcome to Savings Pro.")}
function registerAction(){let n=document.getElementById("rName").value.trim(),u=document.getElementById("rUser").value.trim(),p=document.getElementById("rPass").value,g=document.getElementById("rGcash").value.trim();if(state.users.some(x=>x.username===u)){toast("Username already exists.");return}let m={id:Math.max(...state.users.map(x=>x.id))+1,name:n,username:u,password:p,role:"Member",balance:0,loaded:0,gcash:g,status:"Active",joined:new Date().toISOString().slice(0,10)};state.users.push(m);state.user=m;state.page="Dashboard";save();render();toast("Account created successfully.")}
function logout(){state.user=null;state.page="Landing";render()}
function go(p){if(p==="Landing"||p==="Login"||p==="Register"){state.user=null;state.page=p}else{state.page=p}render()}
function render(){let r=document.getElementById("root");r.innerHTML=state.page==="Landing"?landing():state.page==="Login"?login():state.page==="Register"?register():state.user?appShell():login()}
load();render();
</script>
</body>
</html>
