<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savings Pro</title>
<script type="module">
import{createClient}from"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm"
window.supabase={createClient}
window.dispatchEvent(new Event("supabase-ready"))
</script>
<style>
:root{--orange:#f97316;--orange-light:#fb923c;--orange-dark:#ea580c;--amber:#fbbf24;--ink:#0f0f0f;--dark:#1a1a1a;--dark-2:#222;--card:#fff;--line:#e5e7eb;--muted:#6b7280;--green-ok:#16a34a;--red:#ef4444;--radius:14px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2937}button,input,select{font:inherit}button{cursor:pointer;border:0}a{color:var(--orange);text-decoration:none}

/* ── Header ── */
.header{height:64px;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1200px)/2));position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#fff;cursor:pointer}
.logo{width:34px;height:34px;border-radius:50%;background-image:url("https://media.base44.com/images/public/6a60265126ce76965dce5ea0/2798d58a3_A8.png");background-size:cover;background-position:center;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-shrink:0}
.header-links{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;transition:.15s}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-dark)}
.btn-ghost{background:transparent;color:#fff}.btn-ghost:hover{color:var(--orange-light)}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff}.btn-outline:hover{border-color:var(--orange);color:var(--orange-light)}
.btn-light{background:#fff;color:var(--orange-dark);font-weight:700}.btn-light:hover{background:#f9fafb}

/* ── Landing ── */
.landing{background:linear-gradient(to right bottom,rgba(17,24,39,.82),rgba(120,53,15,.82)),url("https://media.base44.com/images/public/6a60265126ce76965dce5ea0/fb6c4f153_shutterstock_648288439.jpg");background-size:cover;background-position:center;background-attachment:fixed;min-height:100vh}
.hero{text-align:center;padding:80px 20px 60px;display:flex;flex-direction:column;align-items:center}
.hero-logo{width:140px;height:140px;border-radius:50%;background-image:url("https://media.base44.com/images/public/6a60265126ce76965dce5ea0/2798d58a3_A8.png");background-size:cover;background-position:center;margin-bottom:24px;box-shadow:0 8px 30px rgba(249,115,22,.25);border:2px solid rgba(255,255,255,.1)}
.badge{display:inline-block;border:1px solid rgba(251,191,36,.4);color:var(--amber);font-size:11px;letter-spacing:2.5px;font-weight:700;padding:6px 16px;border-radius:6px;margin-bottom:22px}
.hero h1{font-size:clamp(36px,5.5vw,60px);font-weight:800;color:#fff;margin:0 0 18px;line-height:1.1;max-width:780px}
.hero h1 .hl{color:var(--orange)}
.hero p{font-size:17px;line-height:1.7;color:rgba(255,255,255,.7);max-width:640px;margin:0 auto 30px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px;max-width:820px;width:100%}
.glass-card{background:rgba(255,255,255,.07);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:24px;text-align:center}
.glass-card strong{display:block;font-size:28px;font-weight:800;color:#fff;margin-bottom:4px}
.glass-card.amber strong{color:var(--amber)}
.glass-card span{font-size:13px;color:rgba(255,255,255,.6)}

.section{padding:70px 20px;max-width:1100px;margin:auto}
.section.center{text-align:center}
.section h2{font-size:32px;font-weight:700;margin:0 0 10px;color:#1f2937}
.section .sub{color:var(--muted);font-size:16px;margin:0 auto 36px;max-width:560px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;text-align:center}
.step-num{width:44px;height:44px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;margin:0 auto 16px}
.step h3{margin:0 0 8px;font-size:17px}
.step p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.feature{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.feature .ico{width:44px;height:44px;border-radius:12px;background:#fff7ed;display:grid;place-items:center;font-size:20px;color:var(--orange);margin-bottom:14px}
.feature h3{margin:0 0 8px;font-size:17px}
.feature p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.cta{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;text-align:center;padding:64px 20px}
.cta h2{font-size:34px;font-weight:700;margin:0 0 10px}
.cta p{font-size:16px;opacity:.9;margin:0 auto 26px;max-width:480px}
.cta-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta .btn-outline{border-color:rgba(255,255,255,.4)}
.footer{padding:24px;text-align:center;color:var(--muted);font-size:13px;background:#0a0a0a;color:rgba(255,255,255,.4)}

/* ── Auth pages ── */
.auth-bg{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:30px 20px;background:linear-gradient(135deg,#fafafa,#fff)}
.auth-back{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:500;margin-bottom:14px;cursor:pointer}
.auth-back:hover{color:var(--orange)}
.auth-card{width:min(420px,100%);background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.1);overflow:hidden}
.auth-header{background:linear-gradient(135deg,#fca311,#ec6415);padding:28px 24px;text-align:center;color:#fff}
.auth-header .ico{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto 12px;font-size:22px}
.auth-header h2{margin:0;font-size:20px;font-weight:700}
.auth-body{padding:28px 24px}
.auth-body h3{margin:0 0 6px;font-size:20px;font-weight:700;text-align:center;color:#1f2937}
.auth-body .muted{text-align:center;color:var(--muted);font-size:14px;margin:0 0 22px}
.field{margin-bottom:16px}
.field label{font-size:13px;font-weight:600;display:block;margin-bottom:6px;color:#374151}
.field input,.field select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:12px 14px;outline:0;background:#fff;color:#1f2937}
.field input:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
.error{display:none;color:var(--red);font-size:13px;margin:6px 0}
.auth-btn{width:100%;background:linear-gradient(135deg,#fca311,#ec6415);color:#fff;font-weight:700;padding:13px;border-radius:10px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.auth-btn:hover{opacity:.92}
.auth-link{text-align:center;font-size:14px;color:var(--muted);margin-top:18px}
.auth-link a{font-weight:600}
.terms-btn{width:100%;margin-top:12px;background:#fde68a;color:#92400e;font-weight:600;padding:11px;border-radius:10px;font-size:14px}
.terms-btn:hover{background:#fcd34d}

/* ── App shell ── */
.app{min-height:100vh;background:#fafafa}
.app-body{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:fixed;top:64px;bottom:0;display:flex;flex-direction:column}
.sidebar .sb-brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sidebar .sb-brand .logo{width:32px;height:32px}
.sidebar .sb-brand b{color:#1f2937;font-size:15px;display:block}
.sidebar .sb-brand small{color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{border:0;background:transparent;text-align:left;border-radius:10px;padding:11px 12px;color:#4b5563;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.nav button:hover{background:#f3f4f6}
.nav button.active{background:#fff7ed;color:var(--orange-dark)}
.nav .ico{width:20px;text-align:center;font-size:16px}
.sb-footer{border-top:1px solid var(--line);padding-top:14px}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;background:#f3f4f6;border-radius:10px;margin-bottom:10px}
.sb-user .av{width:32px;height:32px;border-radius:50%;background:#6b7280;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.sb-user b{font-size:13px;display:block}
.sb-user small{font-size:11px;color:var(--muted)}
.sb-logout{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:600;padding:8px;cursor:pointer;border-radius:8px}
.sb-logout:hover{color:var(--red);background:#fef2f2}
.content{margin-left:250px;width:calc(100% - 250px);padding:28px;min-height:calc(100vh - 64px)}
.content-inner{max-width:1100px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:24px}
.page-head h1{margin:0;font-size:26px;font-weight:700}
.page-head p{margin:5px 0 0;color:var(--muted);font-size:14px}

/* ── Cards & tables ── */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stat-card .lbl{font-size:12px;color:var(--muted);font-weight:600}
.stat-card .val{font-size:26px;font-weight:800;margin:8px 0 4px;color:#1f2937}
.stat-card .sub{font-size:11px;color:var(--muted)}
.stat-card.accent .val{color:var(--orange)}
.stat-card.amber .val{color:var(--amber)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.card h3{margin:0 0 14px;font-size:16px;font-weight:700}
.grid2{display:grid;grid-template-columns:1.4fr .6fr;gap:16px}
.mt{margin-top:16px}
.wallet-card{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;border-radius:var(--radius);padding:26px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.wallet-card .lbl{font-size:13px;opacity:.85;font-weight:600}
.wallet-card .val{font-size:38px;font-weight:800;margin:8px 0}
.wallet-card .tag{font-size:12px;opacity:.8}
.summary{display:grid;gap:13px}
.summary-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:11px}
.summary-row:last-child{border:0;padding-bottom:0}
.summary-row .lbl{font-size:13px;color:var(--muted)}
.summary-row b{font-size:14px}
.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px;color:#9a3412;font-size:13px;line-height:1.6}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;white-space:nowrap}
.table th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge.Paid,.badge.Active{background:#dcfce7;color:#16a34a}
.badge.Pending{background:#fef3c7;color:#d97706}
.badge.Rejected,.badge.Failed{background:#fee2e2;color:#ef4444}
.empty{text-align:center;padding:36px;color:var(--muted);font-size:14px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:100}
.modal{background:#fff;border-radius:16px;width:min(480px,100%);padding:26px;box-shadow:0 25px 60px rgba(0,0,0,.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.modal-head h2{margin:0;font-size:20px;font-weight:700}
.modal .close{border:0;border-radius:50%;width:34px;height:34px;background:#f3f4f6;font-size:18px;color:#6b7280;cursor:pointer}
.modal .close:hover{background:#e5e7eb}
.modal .muted{color:var(--muted);font-size:14px;margin:0 0 18px}

/* ── Toast ── */
.toast{position:fixed;right:20px;bottom:20px;background:#1f2937;color:#fff;padding:13px 18px;border-radius:10px;display:none;z-index:200;font-size:14px;font-weight:500;box-shadow:0 8px 25px rgba(0,0,0,.2)}

@media(max-width:900px){.stat-cards{grid-template-columns:repeat(2,1fr)}.grid2,.profile-grid{grid-template-columns:1fr}.hero-stats{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}.features{grid-template-columns:1fr}}
@media(max-width:650px){.header{padding:0 14px}.sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}.sidebar .sb-brand{display:none}.nav{flex-direction:row;overflow-x:auto;white-space:nowrap}.sb-footer{display:none}.content{margin:0;width:100%;padding:16px}.hero-stats{margin-top:36px}.section{padding:50px 20px}}
</style>
</head>
<body><div id="root"></div><div id="toast" class="toast"></div>
<script src="config.js"></script>
<script>
/* ════════ STATE ════════ */
const state={page:"Landing",user:null,users:[],withdrawals:[],loads:[]};

const SEED={
 users:[
  {id:1,name:"Tan",username:"Tan",password:"heyhey",role:"Admin",balance:0,loaded:0,gcash:"",status:"Active",joined:"2026-01-10"},
  {id:2,name:"Juan Dela Cruz",username:"juan",password:"demo",role:"Member",balance:4250,loaded:5000,gcash:"09171234567",status:"Active",joined:"2026-02-03"},
  {id:3,name:"Maria Santos",username:"maria",password:"demo",role:"Member",balance:1850,loaded:2500,gcash:"09181234567",status:"Active",joined:"2026-02-14"},
  {id:4,name:"Pedro Reyes",username:"pedro",password:"demo",role:"Member",balance:900,loaded:1500,gcash:"09201234567",status:"Active",joined:"2026-03-01"}
 ],
 withdrawals:[
  {id:"WD-1001",user:"Juan Dela Cruz",amount:750,gcash:"09171234567",status:"Pending",date:"2026-08-12"},
  {id:"WD-1002",user:"Maria Santos",amount:500,gcash:"09181234567",status:"Pending",date:"2026-08-20"},
  {id:"WD-1003",user:"Pedro Reyes",amount:300,gcash:"09201234567",status:"Paid",date:"2026-09-03"}
 ],
 loads:[
  {id:"LD-1001",user:"Juan Dela Cruz",amount:5000,date:"2026-08-01"},
  {id:"LD-1002",user:"Maria Santos",amount:2500,date:"2026-08-05"},
  {id:"LD-1003",user:"Pedro Reyes",amount:1500,date:"2026-08-18"}
 ]
};

/* ════════ SUPABASE ════════ */
let sb=null,sbAdmin=null,useSB=false;
function getServiceKey(){
 const stored=localStorage.getItem("supabase_service_key");
 if(stored&&stored.trim())return stored.trim();
 return(window.SUPABASE_SERVICE_KEY||"").trim();
}
function initSB(){
 const url=(window.SUPABASE_URL||"").trim(),key=(window.SUPABASE_ANON_KEY||"").trim();
 if(url&&key&&!url.includes("placeholder")&&!url.includes("example")&&window.supabase){
  sb=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,storage:localStorage,detectSessionInUrl:true}});
  useSB=true;
  const sk=getServiceKey();
  if(sk&&!sk.includes("placeholder"))
   sbAdmin=window.supabase.createClient(url,sk,{auth:{autoRefreshToken:false,persistSession:false}});
  sb.auth.onAuthStateChange(async(event,session)=>{
   if(session&&(event==="SIGNED_IN"||event==="TOKEN_REFRESHED"))
    localStorage.setItem("sb_session_backup",JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token,expires_at:session.expires_at}));
   if((event==="INITIAL_SESSION"||event==="SIGNED_IN")&&session&&!state.user){
    await loadData();
    const p=state.users.find(u=>u.auth_id===session.user.id);
    if(p){state.user=p;state.page="Dashboard";render()}
    else{
     const{data:prof}=await sb.from("profiles").select("*").eq("auth_id",session.user.id).single();
     if(prof){state.user=prof;state.page="Dashboard";render()}
    }
   }
  });
 }
}
function saveServiceKey(){
 const val=document.getElementById("serviceKeyInput").value.trim();
 if(!val){toast("Please enter a service key.");return}
 localStorage.setItem("supabase_service_key",val);
 const url=(window.SUPABASE_URL||"").trim();
 if(url&&window.supabase){
  sbAdmin=window.supabase.createClient(url,val,{auth:{autoRefreshToken:false,persistSession:false}});
 }
 toast("Service key saved.");
}

/* ════════ DATA LAYER ════════ */
async function loadData(){
 if(!useSB)return;
 try{
  const[{data:users,error:e1},{data:wds,error:e2},{data:lds,error:e3}]=await Promise.all([
   sb.from("profiles").select("*"),
   sb.from("withdrawals").select("*").order("date",{ascending:false}),
   sb.from("loads").select("*").order("date",{ascending:false})
  ]);
  if(e1)console.error("profiles load error:",e1.message);
  state.users=users||[];
  state.withdrawals=(wds||[]).map(w=>({...w,user:w.user_name}));
  state.loads=(lds||[]).map(l=>({...l,user:l.user_name}));
 }catch(e){console.error("loadData error:",e)}
}
function loadLocal(){
 try{const x=JSON.parse(localStorage.getItem("savings_pro_demo"));
  if(x){Object.assign(state,x);return}
 }catch{}
 Object.assign(state,JSON.parse(JSON.stringify(SEED)));saveLocal();
}
function saveLocal(){localStorage.setItem("savings_pro_demo",JSON.stringify({users:state.users,withdrawals:state.withdrawals,loads:state.loads}))}

/* ════════ AUTH ════════ */
async function checkSession(){
 if(!useSB)return;
 let session=null;
 // Try backup first
 const backup=localStorage.getItem("sb_session_backup");
 if(backup){
  try{
   const parsed=JSON.parse(backup);
   if(parsed.access_token&&parsed.refresh_token){
    console.log("[checkSession] trying backup setSession...");
    const{data,error}=await sb.auth.setSession({access_token:parsed.access_token,refresh_token:parsed.refresh_token});
    if(error)console.log("[checkSession] backup setSession error:",error.message);
    if(!error&&data.session){session=data.session;console.log("[checkSession] backup restored OK")}
   }
  }catch(e){console.log("[checkSession] backup parse error:",e.message)}
 }
 // Try getSession
 if(!session){
  console.log("[checkSession] trying getSession...");
  let{data:sData,error:sErr}=await sb.auth.getSession();
  if(sErr)console.log("[checkSession] getSession error:",sErr.message);
  if(!sErr&&sData.session){session=sData.session;console.log("[checkSession] getSession OK")}
 }
 // Try raw Supabase localStorage token
 if(!session){
  const sbKey=Object.keys(localStorage).find(k=>k.startsWith("sb-")&&k.endsWith("-auth-token"));
  if(sbKey){
   try{
    const raw=JSON.parse(localStorage.getItem(sbKey));
    if(raw&&raw.access_token&&raw.refresh_token){
     console.log("[checkSession] trying raw token setSession...");
     const{data,error}=await sb.auth.setSession({access_token:raw.access_token,refresh_token:raw.refresh_token});
     if(error)console.log("[checkSession] raw token error:",error.message);
     if(!error&&data.session){session=data.session;console.log("[checkSession] raw token restored OK")}
    }
   }catch(e){console.log("[checkSession] raw token parse error:",e.message)}
  }
 }
 if(!session){console.log("[checkSession] no session found, staying on landing");return}
 console.log("[checkSession] session found for user:",session.user.id);
 await loadData();
 const p=state.users.find(u=>u.auth_id===session.user.id);
 if(p){state.user=p;state.page="Dashboard";console.log("[checkSession] profile found via state.users")}
 else{
  let{data:prof,error:pe}=await sb.from("profiles").select("*").eq("auth_id",session.user.id).single();
  if(pe&&sbAdmin){const r=await sbAdmin.from("profiles").select("*").eq("auth_id",session.user.id).single();prof=r.data}
  if(prof){state.user=prof;state.page="Dashboard";console.log("[checkSession] profile found via query")}
  else{console.log("[checkSession] no profile found!")}
 }
}
async function loginAction(){
 let u=document.getElementById("loginUser").value.trim(),p=document.getElementById("loginPass").value;
 if(useSB){
  const{data,error}=await sb.auth.signInWithPassword({email:u+"@savingspro.app",password:p});
  if(error){document.getElementById("loginError").style.display="block";return}
  if(data.session)localStorage.setItem("sb_session_backup",JSON.stringify({access_token:data.session.access_token,refresh_token:data.session.refresh_token,expires_at:data.session.expires_at}));
  await loadData();
  const prof=state.users.find(x=>x.auth_id===data.user.id);
  if(!prof){toast("Profile not found.");return}
  state.user=prof;state.page="Dashboard";render();toast("Welcome to Savings Pro.");
 }else{
  let f=state.users.find(x=>x.username===u&&x.password===p);
  if(!f){document.getElementById("loginError").style.display="block";return}
  state.user=f;state.page="Dashboard";render();toast("Welcome to Savings Pro.");
 }
}
async function registerAction(){
 let u=document.getElementById("rUser").value.trim(),p=document.getElementById("rPass").value,p2=document.getElementById("rPass2").value;
 if(p!==p2){document.getElementById("regError").style.display="block";return}
 if(useSB){
  const{data,error}=await sb.auth.signUp({email:u+"@savingspro.app",password:p});
  if(error){toast(error.message);return}
  let session=data.session;
  if(!session){
   if(sbAdmin){try{await sbAdmin.auth.admin.updateUserById(data.user.id,{email_confirm:true})}catch{}}
   const{data:si}=await sb.auth.signInWithPassword({email:u+"@savingspro.app",password:p});
   if(si.session)session=si.session;
  }
  if(session)localStorage.setItem("sb_session_backup",JSON.stringify({access_token:session.access_token,refresh_token:session.refresh_token,expires_at:session.expires_at}));
  await new Promise(r=>setTimeout(r,500));
  let prof=null;
  let{data:qData,error:qErr}=await sb.from("profiles").select("*").eq("auth_id",data.user.id).single();
  if(qData)prof=qData;
  if(!prof){
   const name=u.charAt(0).toUpperCase()+u.slice(1);
   const profileData={auth_id:data.user.id,name,username:u,role:"Member",balance:0,loaded:0,gcash:"",status:"Active",
    joined:new Date().toISOString().slice(0,10)};
   let{data:insData,error:insErr}=await sb.from("profiles").insert(profileData).select().single();
   if(insErr&&sbAdmin){const r=await sbAdmin.from("profiles").insert(profileData).select().single();prof=r.data}
   else prof=insData;
  }
  if(!prof){toast("Failed to create profile. Run the updated schema SQL in Supabase.");return}
  state.user=prof;await loadData();state.page="Dashboard";render();toast("Account created successfully.");
 }else{
  if(state.users.some(x=>x.username===u)){toast("Username already exists.");return}
  let name=u.charAt(0).toUpperCase()+u.slice(1);
  let m={id:Math.max(...state.users.map(x=>x.id))+1,name,username:u,password:p,role:"Member",balance:0,loaded:0,gcash:"",status:"Active",joined:new Date().toISOString().slice(0,10)};
  state.users.push(m);state.user=m;state.page="Dashboard";saveLocal();render();toast("Account created successfully.");
 }
}
function logout(){if(useSB)sb.auth.signOut();localStorage.removeItem("sb_session_backup");state.user=null;state.page="Landing";render()}

async function submitLoad(){
 let un=document.getElementById("loadUser").value,a=Number(document.getElementById("loadAmount").value);
 if(!a||a<=0){toast("Enter a valid amount.");return}
 let u=state.users.find(x=>x.username===un);if(!u)return;
 if(useSB){
  await sb.from("profiles").update({balance:u.balance+a,loaded:u.loaded+a}).eq("id",u.id);
  await sb.from("loads").insert({id:"LD-"+(1001+state.loads.length),user_id:u.id,user_name:u.name,amount:a,date:new Date().toISOString().slice(0,10)});
  await loadData();state.user=state.users.find(x=>x.id===state.user.id)||state.user;
 }else{
  u.balance+=a;u.loaded+=a;state.loads.unshift({id:"LD-"+(1001+state.loads.length),user:u.name,amount:a,date:new Date().toISOString().slice(0,10)});saveLocal();
 }
 closeModal();render();toast(peso(a)+" loaded to "+u.name+".");
}
async function submitWithdrawal(){
 let a=Number(document.getElementById("wdAmount").value);
 if(a<300||a>state.user.balance){toast("Enter a valid withdrawal amount.");return}
 let u=state.users.find(x=>x.id===state.user.id);if(!u)return;
 if(useSB){
  await sb.from("profiles").update({balance:u.balance-a}).eq("id",u.id);
  await sb.from("withdrawals").insert({id:"WD-"+(1001+state.withdrawals.length),user_id:u.id,user_name:u.name,amount:a,gcash:u.gcash,status:"Pending",date:new Date().toISOString().slice(0,10)});
  await loadData();state.user=state.users.find(x=>x.id===state.user.id)||state.user;
 }else{
  u.balance-=a;state.withdrawals.unshift({id:"WD-"+(1001+state.withdrawals.length),user:u.name,amount:a,gcash:u.gcash,status:"Pending",date:new Date().toISOString().slice(0,10)});saveLocal();
 }
 closeModal();render();toast("Withdrawal request submitted.");
}
async function pay(id){
 let w=state.withdrawals.find(x=>x.id===id);if(!w)return;
 if(useSB){await sb.from("withdrawals").update({status:"Paid"}).eq("id",id);await loadData()}
 else{w.status="Paid";saveLocal()}
 render();toast("Withdrawal marked as paid.");
}
async function addMember(){
 let n=prompt("Full name:");if(!n)return;
 let u=prompt("Username:",n.toLowerCase().replace(/\s+/g,""));if(!u)return;
 let g=prompt("GCash number:","09");if(!g)return;
 if(useSB){
  if(!sbAdmin){toast("Admin key not configured.");return}
  const{data,error}=await sbAdmin.auth.admin.createUser({email:u+"@savingspro.app",password:"demo",email_confirm:true});
  if(error){toast(error.message);return}
  await sbAdmin.from("profiles").insert({auth_id:data.user.id,name:n,username:u,role:"Member",balance:0,loaded:0,gcash:g,status:"Active",joined:new Date().toISOString().slice(0,10)});
  await loadData();
 }else{
  if(state.users.some(x=>x.username===u)){toast("Username already exists.");return}
  state.users.push({id:Math.max(...state.users.map(x=>x.id))+1,name:n,username:u,password:"demo",role:"Member",balance:0,loaded:0,gcash:g,status:"Active",joined:new Date().toISOString().slice(0,10)});saveLocal();
 }
 render();toast("Member created.");
}
async function saveProfile(){
 let u=state.users.find(x=>x.id===state.user.id);if(!u)return;
 let name=document.getElementById("pName").value.trim()||u.name;
 let gcash=document.getElementById("pGcash").value.trim();
 if(useSB){
  await sb.from("profiles").update({name,gcash}).eq("id",u.id);
  await loadData();state.user=state.users.find(x=>x.id===state.user.id)||state.user;
 }else{
  u.name=name;u.gcash=gcash;state.user=u;saveLocal();
 }
 render();toast("Profile updated.");
}
