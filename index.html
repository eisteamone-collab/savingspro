<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savings Pro</title>
<style>
:root{--orange:#f97316;--orange-light:#fb923c;--orange-dark:#ea580c;--amber:#fbbf24;--ink:#0f0f0f;--dark:#1a1a1a;--dark-2:#222;--card:#fff;--line:#e5e7eb;--muted:#6b7280;--green-ok:#16a34a;--red:#ef4444;--radius:14px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1f2937}button,input,select{font:inherit}button{cursor:pointer;border:0}a{color:var(--orange);text-decoration:none}

/* ── Header ── */
.header{height:64px;background:rgba(10,10,10,.92);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1200px)/2));position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:#fff;cursor:pointer}
.logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1e3a8a,#f59e0b);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.header-links{display:flex;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;transition:.15s}
.btn-primary{background:var(--orange);color:#fff}.btn-primary:hover{background:var(--orange-dark)}
.btn-ghost{background:transparent;color:#fff}.btn-ghost:hover{color:var(--orange-light)}
.btn-outline{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff}.btn-outline:hover{border-color:var(--orange);color:var(--orange-light)}
.btn-light{background:#fff;color:var(--orange-dark);font-weight:700}.btn-light:hover{background:#f9fafb}

/* ── Landing ── */
.landing{background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.85)),radial-gradient(ellipse at 30% 40%,rgba(249,115,22,.08),transparent 50%),radial-gradient(ellipse at 70% 60%,rgba(251,191,36,.06),transparent 50%),#0a0a0a;min-height:100vh}
.hero{text-align:center;padding:80px 20px 60px;display:flex;flex-direction:column;align-items:center}
.hero-logo{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#1e3a8a,#f59e0b);display:grid;place-items:center;color:#fff;font-size:28px;font-weight:800;margin-bottom:24px;box-shadow:0 8px 30px rgba(249,115,22,.25)}
.badge{display:inline-block;border:1px solid rgba(251,191,36,.4);color:var(--amber);font-size:11px;letter-spacing:2.5px;font-weight:700;padding:6px 16px;border-radius:6px;margin-bottom:22px}
.hero h1{font-size:clamp(36px,5.5vw,60px);font-weight:800;color:#fff;margin:0 0 18px;line-height:1.1;max-width:780px}
.hero h1 .hl{color:var(--orange)}
.hero p{font-size:17px;line-height:1.7;color:rgba(255,255,255,.7);max-width:640px;margin:0 auto 30px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px;max-width:820px;width:100%}
.glass-card{background:rgba(255,255,255,.07);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);padding:24px;text-align:center}
.glass-card strong{display:block;font-size:28px;font-weight:800;color:#fff;margin-bottom:4px}
.glass-card.amber strong{color:var(--amber)}
.glass-card span{font-size:13px;color:rgba(255,255,255,.6)}

.section{padding:70px 20px;max-width:1100px;margin:auto}
.section.center{text-align:center}
.section h2{font-size:32px;font-weight:700;margin:0 0 10px;color:#1f2937}
.section .sub{color:var(--muted);font-size:16px;margin:0 auto 36px;max-width:560px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;text-align:center}
.step-num{width:44px;height:44px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;margin:0 auto 16px}
.step h3{margin:0 0 8px;font-size:17px}
.step p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.feature{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px}
.feature .ico{width:44px;height:44px;border-radius:12px;background:#fff7ed;display:grid;place-items:center;font-size:20px;color:var(--orange);margin-bottom:14px}
.feature h3{margin:0 0 8px;font-size:17px}
.feature p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.cta{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;text-align:center;padding:64px 20px}
.cta h2{font-size:34px;font-weight:700;margin:0 0 10px}
.cta p{font-size:16px;opacity:.9;margin:0 auto 26px;max-width:480px}
.cta-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta .btn-outline{border-color:rgba(255,255,255,.4)}
.footer{padding:24px;text-align:center;color:var(--muted);font-size:13px;background:#0a0a0a;color:rgba(255,255,255,.4)}

/* ── Auth pages ── */
.auth-bg{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:30px 20px;background:linear-gradient(135deg,#fafafa,#fff)}
.auth-back{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;font-weight:500;margin-bottom:14px;cursor:pointer}
.auth-back:hover{color:var(--orange)}
.auth-card{width:min(420px,100%);background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.1);overflow:hidden}
.auth-header{background:linear-gradient(135deg,#fca311,#ec6415);padding:28px 24px;text-align:center;color:#fff}
.auth-header .ico{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;margin:0 auto 12px;font-size:22px}
.auth-header h2{margin:0;font-size:20px;font-weight:700}
.auth-body{padding:28px 24px}
.auth-body h3{margin:0 0 6px;font-size:20px;font-weight:700;text-align:center;color:#1f2937}
.auth-body .muted{text-align:center;color:var(--muted);font-size:14px;margin:0 0 22px}
.field{margin-bottom:16px}
.field label{font-size:13px;font-weight:600;display:block;margin-bottom:6px;color:#374151}
.field input,.field select{width:100%;border:1px solid #d1d5db;border-radius:10px;padding:12px 14px;outline:0;background:#fff;color:#1f2937}
.field input:focus,.field select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
.field-err{border-color:var(--red)!important}
.error{display:none;color:var(--red);font-size:13px;margin:6px 0}
.auth-btn{width:100%;background:linear-gradient(135deg,#fca311,#ec6415);color:#fff;font-weight:700;padding:13px;border-radius:10px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.auth-btn:hover{opacity:.92}
.auth-link{text-align:center;font-size:14px;color:var(--muted);margin-top:18px}
.auth-link a{font-weight:600}
.terms-btn{width:100%;margin-top:12px;background:#fde68a;color:#92400e;font-weight:600;padding:11px;border-radius:10px;font-size:14px}
.terms-btn:hover{background:#fcd34d}

/* ── App shell ── */
.app{min-height:100vh;background:#fafafa}
.app-body{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:250px;background:#fff;border-right:1px solid var(--line);padding:20px 14px;position:fixed;top:64px;bottom:0;display:flex;flex-direction:column}
.sidebar .sb-brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--line);margin-bottom:14px}
.sidebar .sb-brand .logo{width:32px;height:32px;font-size:12px}
.sidebar .sb-brand b{color:#1f2937;font-size:15px;display:block}
.sidebar .sb-brand small{color:var(--muted);font-size:11px}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav button{border:0;background:transparent;text-align:left;border-radius:10px;padding:11px 12px;color:#4b5563;font-weight:600;font-size:14px;display:flex;align-items:center;gap:10px}
.nav button:hover{background:#f3f4f6}
.nav button.active{background:#fff7ed;color:var(--orange-dark)}
.nav .ico{width:20px;text-align:center;font-size:16px}
.sb-footer{border-top:1px solid var(--line);padding-top:14px}
.sb-user{display:flex;align-items:center;gap:10px;padding:8px;background:#f3f4f6;border-radius:10px;margin-bottom:10px}
.sb-user .av{width:32px;height:32px;border-radius:50%;background:#6b7280;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.sb-user b{font-size:13px;display:block}
.sb-user small{font-size:11px;color:var(--muted)}
.sb-logout{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:600;padding:8px;cursor:pointer;border-radius:8px}
.sb-logout:hover{color:var(--red);background:#fef2f2}
.content{margin-left:250px;width:calc(100% - 250px);padding:28px;min-height:calc(100vh - 64px)}
.content-inner{max-width:1100px;margin:auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:24px}
.page-head h1{margin:0;font-size:26px;font-weight:700}
.page-head p{margin:5px 0 0;color:var(--muted);font-size:14px}

/* ── Cards & tables ── */
.stat-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.stat-card .lbl{font-size:12px;color:var(--muted);font-weight:600}
.stat-card .val{font-size:26px;font-weight:800;margin:8px 0 4px;color:#1f2937}
.stat-card .sub{font-size:11px;color:var(--muted)}
.stat-card.accent .val{color:var(--orange)}
.stat-card.amber .val{color:var(--amber)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px}
.card h3{margin:0 0 14px;font-size:16px;font-weight:700}
.grid2{display:grid;grid-template-columns:1.4fr .6fr;gap:16px}
.mt{margin-top:16px}
.wallet-card{background:linear-gradient(135deg,var(--orange),var(--orange-dark));color:#fff;border-radius:var(--radius);padding:26px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between}
.wallet-card .lbl{font-size:13px;opacity:.85;font-weight:600}
.wallet-card .val{font-size:38px;font-weight:800;margin:8px 0}
.wallet-card .tag{font-size:12px;opacity:.8}
.summary{display:grid;gap:13px}
.summary-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:11px}
.summary-row:last-child{border:0;padding-bottom:0}
.summary-row .lbl{font-size:13px;color:var(--muted)}
.summary-row b{font-size:14px}
.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:14px;color:#9a3412;font-size:13px;line-height:1.6}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;white-space:nowrap}
.table th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge.Paid,.badge.Active{background:#dcfce7;color:#16a34a}
.badge.Pending{background:#fef3c7;color:#d97706}
.badge.Rejected,.badge.Failed{background:#fee2e2;color:#ef4444}
.empty{text-align:center;padding:36px;color:var(--muted);font-size:14px}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ── Modal ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:100}
.modal{background:#fff;border-radius:16px;width:min(480px,100%);padding:26px;box-shadow:0 25px 60px rgba(0,0,0,.2)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.modal-head h2{margin:0;font-size:20px;font-weight:700}
.modal .close{border:0;border-radius:50%;width:34px;height:34px;background:#f3f4f6;font-size:18px;color:#6b7280;cursor:pointer}
.modal .close:hover{background:#e5e7eb}
.modal .muted{color:var(--muted);font-size:14px;margin:0 0 18px}

/* ── Toast ── */
.toast{position:fixed;right:20px;bottom:20px;background:#1f2937;color:#fff;padding:13px 18px;border-radius:10px;display:none;z-index:200;font-size:14px;font-weight:500;box-shadow:0 8px 25px rgba(0,0,0,.2)}

@media(max-width:900px){.stat-cards{grid-template-columns:repeat(2,1fr)}.grid2,.profile-grid{grid-template-columns:1fr}.hero-stats{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:1fr}.features{grid-template-columns:1fr}}
@media(max-width:650px){.header{padding:0 14px}.sidebar{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px}.sidebar .sb-brand{display:none}.nav{flex-direction:row;overflow-x:auto;white-space:nowrap}.sb-footer{display:none}.content{margin:0;width:100%;padding:16px}.hero-stats{margin-top:36px}.section{padding:50px 20px}}
</style>
</head>
<body><div id="root"></div><div id="toast" class="toast"></div>
<script>
const state={
 page:"Landing", user:null,
 users:[
  {id:1,name:"Tan",username:"Tan",password:"heyhey",role:"Admin",balance:0,loaded:0,gcash:"",status:"Active",joined:"2026-01-10"},
  {id:2,name:"Juan Dela Cruz",username:"juan",password:"demo",role:"Member",balance:4250,loaded:5000,gcash:"09171234567",status:"Active",joined:"2026-02-03"},
  {id:3,name:"Maria Santos",username:"maria",password:"demo",role:"Member",balance:1850,loaded:2500,gcash:"09181234567",status:"Active",joined:"2026-02-14"},
  {id:4,name:"Pedro Reyes",username:"pedro",password:"demo",role:"Member",balance:900,loaded:1500,gcash:"09201234567",status:"Active",joined:"2026-03-01"}
 ],
 withdrawals:[
  {id:"WD-1001",user:"Juan Dela Cruz",amount:750,gcash:"09171234567",status:"Pending",date:"2026-08-12"},
  {id:"WD-1002",user:"Maria Santos",amount:500,gcash:"09181234567",status:"Pending",date:"2026-08-20"},
  {id:"WD-1003",user:"Pedro Reyes",amount:300,gcash:"09201234567",status:"Paid",date:"2026-09-03"}
 ],
 loads:[
  {id:"LD-1001",user:"Juan Dela Cruz",amount:5000,date:"2026-08-01"},
  {id:"LD-1002",user:"Maria Santos",amount:2500,date:"2026-08-05"},
  {id:"LD-1003",user:"Pedro Reyes",amount:1500,date:"2026-08-18"}
 ]
};
function peso(n){return "₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:0,maximumFractionDigits:2})}
function save(){localStorage.setItem("savings_pro_demo",JSON.stringify({users:state.users,withdrawals:state.withdrawals,loads:state.loads}))}
function load(){try{const x=JSON.parse(localStorage.getItem("savings_pro_demo"));if(x)Object.assign(state,x)}catch{}}
function toast(x){let t=document.getElementById("toast");t.textContent=x;t.style.display="block";setTimeout(()=>t.style.display="none",2400)}
function header(auth){
 return `<header class="header"><div class="brand" onclick="go('Landing')"><span class="logo">SP</span>Savings Pro</div>${auth?`<div class="header-links"><button class="btn btn-ghost" onclick="logout()">Logout</button></div>`:`<div class="header-links"><button class="btn btn-ghost" onclick="go('Login')">Log In</button><button class="btn btn-primary" onclick="go('Register')">Sign Up →</button></div>`}</header>`;
}

/* ── Landing ── */
function landing(){
 return `${header()}<div class="landing">
<section class="hero">
 <div class="hero-logo">SP</div>
 <div class="badge">SAVE YOUR BUDGET MORE</div>
 <h1>Save Smart with <span class="hl">Savings Pro</span></h1>
 <p>A simple savings wallet loaded by the admin. Track your balance, request withdrawals to GCash, and watch your savings grow — no codes, no levels, just savings.</p>
 <div class="hero-actions">
  <button class="btn btn-primary" onclick="go('Register')">Get Started Free →</button>
  <button class="btn btn-outline" onclick="go('Login')">Log In to My Wallet</button>
 </div>
 <div class="hero-stats">
  <div class="glass-card"><strong>1,200+</strong><span>Active Members</span></div>
  <div class="glass-card"><strong>₱5M+</strong><span>Total Saved</span></div>
  <div class="glass-card"><strong>₱300</strong><span>Min Withdrawal</span></div>
  <div class="glass-card amber"><strong>GCash</strong><span>Payout Method</span></div>
 </div>
</section>
<section class="section center">
 <h2>How Savings Pro Works</h2>
 <p class="sub">Three simple steps to start saving.</p>
 <div class="steps">
  <div class="step"><div class="step-num">1</div><h3>Create Your Account</h3><p>Sign up and complete your profile with your GCash details.</p></div>
  <div class="step"><div class="step-num">2</div><h3>Admin Loads Your Wallet</h3><p>The admin funds your savings wallet. Your balance updates instantly.</p></div>
  <div class="step"><div class="step-num">3</div><h3>Withdraw Anytime</h3><p>Request a withdrawal and receive it straight to your GCash account.</p></div>
 </div>
</section>
<section class="section center" style="background:#fff">
 <h2>Why Choose Savings Pro?</h2>
 <p class="sub">Everything you need to manage your savings in one place.</p>
 <div class="features">
  <div class="feature"><div class="ico">◉</div><h3>Your Savings Wallet</h3><p>Track your savings balance in one simple wallet. Every load from the admin shows up instantly.</p></div>
  <div class="feature"><div class="ico">＋</div><h3>Admin-Loaded Savings</h3><p>Your wallet is funded by the admin — no codes, no levels, just straightforward savings.</p></div>
  <div class="feature"><div class="ico">₱</div><h3>GCash Withdrawals</h3><p>Request a withdrawal anytime and receive it straight to your GCash account.</p></div>
  <div class="feature"><div class="ico">✓</div><h3>Secure & Simple</h3><p>A clean, secure wallet experience focused only on your savings and withdrawals.</p></div>
 </div>
</section>
<section class="cta">
 <h2>Ready to Start Saving?</h2>
 <p>Join hundreds of members already growing their savings with Savings Pro.</p>
 <div class="cta-actions">
  <button class="btn btn-outline" onclick="go('Register')">Create Free Account</button>
  <button class="btn btn-light" onclick="go('Login')">Already a Member?</button>
 </div>
</section>
<footer class="footer">© 2026 Savings Pro. All rights reserved.</footer>
</div>`;
}

/* ── Login ── */
function login(){
 return `${header()}<div class="auth-bg"><div>
  <div class="auth-card">
   <div class="auth-header"><div class="ico">🔑</div><h2>Savings Pro Member Log In</h2></div>
   <div class="auth-body">
    <h3>Member Login</h3>
    <p class="muted">Access your savings wallet and account.</p>
    <form onsubmit="event.preventDefault();loginAction()">
     <div class="field"><label>Username</label><input id="loginUser" required placeholder="Enter your username"></div>
     <div class="field"><label>Password</label><input id="loginPass" type="password" required placeholder="Enter your password"></div>
     <div id="loginError" class="error">Invalid username or password.</div>
     <button class="auth-btn" type="submit">→ Login</button>
    </form>
    <p class="auth-link">Don't have an account? <a href="#" onclick="go('Register');return false">Register here</a></p>
   </div>
  </div>
 </div></div>`;
}

/* ── Register ── */
function register(){
 return `${header()}<div class="auth-bg"><div>
  <div class="auth-back" onclick="go('Login')">← Back to Login</div>
  <div class="auth-card">
   <div class="auth-header"><div class="ico">👤＋</div><h2>Savings Pro Registration</h2></div>
   <div class="auth-body">
    <form onsubmit="event.preventDefault();registerAction()">
     <div class="field"><label>Username *</label><input id="rUser" required placeholder="Choose a username"></div>
     <div class="field"><label>Password *</label><input id="rPass" type="password" required placeholder="At least 6 characters"></div>
     <div class="field"><label>Confirm Password *</label><input id="rPass2" type="password" required placeholder="Re-enter your password"></div>
     <div id="regError" class="error">Passwords do not match.</div>
     <button class="auth-btn" type="submit">👤＋ Submit Registration</button>
    </form>
    <p class="auth-link">Already have an account? <a href="#" onclick="go('Login');return false">Login here</a></p>
    <button class="terms-btn" onclick="window.open('https://forms.gle/bMLvWgG2KGfYXzBz8','_blank')">Membership Terms & Conditions</button>
   </div>
  </div>
 </div></div>`;
}

/* ── App shell ── */
function sideNav(){
 let items = state.user.role==="Admin"
  ? ["Dashboard","Members","Wallet Loads","Withdrawals","Monitoring","Profile"]
  : ["Dashboard","Total Withdrawal","My Profile"];
 let icons = {Dashboard:"▦",Members:"♙","Wallet Loads":"＋",Withdrawals:"↗",Monitoring:"◉","Total Withdrawal":"↗","My Profile":"○",Profile:"○"};
 return `<aside class="sidebar">
  <div class="sb-brand"><span class="logo">SP</span><div><b>Savings Pro</b><br><small>Savings Wallet</small></div></div>
  <nav class="nav">${items.map(x=>`<button class="${state.page===x?'active':''}" onclick="go('${x}')"><span class="ico">${icons[x]||"•"}</span> ${x}</button>`).join("")}</nav>
  <div class="sb-footer">
   <div class="sb-user"><div class="av">${(state.user.name||'U')[0]}</div><div><b>${state.user.name}</b><small>${state.user.role}</small></div></div>
   <div class="sb-logout" onclick="logout()">⏻ Logout</div>
  </div>
 </aside>`;
}
function appShell(){return `<div class="app">${header(true)}<div class="app-body">${sideNav()}<main class="content"><div class="content-inner">${page()}</div></main></div></div>`}

function page(){
 switch(state.page){
  case"Dashboard":return dashboard();
  case"Total Withdrawal":return withdrawals();
  case"My Profile":return profile();
  case"Withdrawals":return withdrawals();
  case"Members":return members();
  case"Wallet Loads":return loads();
  case"Monitoring":return monitoring();
  case"Profile":return profile();
  default:return dashboard();
 }
}

/* ── Dashboard ── */
function dashboard(){
 if(state.user.role==="Admin")return adminDashboard();
 return `<div class="page-head"><div><h1>My Savings</h1><p>Welcome back, ${state.user.name}.</p></div><button class="btn btn-primary" onclick="withdrawModal()">Request Withdrawal</button></div>
 <div class="grid2">
  <div class="wallet-card"><div><div class="lbl">AVAILABLE BALANCE</div><div class="val">${peso(state.user.balance)}</div></div><div class="tag">Savings wallet · GCash withdrawals</div></div>
  <div class="card"><h3>Account Summary</h3><div class="summary">${srow("Total loaded",peso(state.user.loaded))}${srow("Total withdrawn",peso(totalWithdrawn(state.user.name)))}${srow("Minimum withdrawal",peso(300))}${srow("GCash",state.user.gcash||"Not set")}</div></div>
 </div>
 <div class="card mt"><h3>Recent Activity</h3>${activityTable(state.user.name)}</div>`;
}
function adminDashboard(){
 return `<div class="page-head"><div><h1>Admin Dashboard</h1><p>Manage savings wallets, loads, and withdrawals.</p></div><button class="btn btn-primary" onclick="loadModal()">Load Wallet</button></div>
 <div class="stat-cards">
  ${stat("Total Members",state.users.filter(u=>u.role==="Member").length,"Registered members")}
  ${stat("Total Saved",peso(state.users.reduce((a,u)=>a+(u.balance||0),0)),"Current balances","",true)}
  ${stat("Pending Withdrawals",state.withdrawals.filter(w=>w.status==="Pending").length,"Awaiting review","amber")}
  ${stat("Total Loaded",peso(state.users.reduce((a,u)=>a+(u.loaded||0),0)),"Wallet funding")}
 </div>
 <div class="grid2 mt">
  <div class="card"><h3>Recent Wallet Loads</h3>${loadTable(5)}</div>
  <div class="card"><h3>Withdrawal Requests</h3>${withdrawTable(5)}</div>
 </div>`;
}
function stat(l,v,s,cls="",accent=false){return `<div class="stat-card ${cls} ${accent?'accent':''}"><div class="lbl">${l}</div><div class="val">${v}</div><div class="sub">${s}</div></div>`}
function srow(a,b){return `<div class="summary-row"><span class="lbl">${a}</span><b>${b}</b></div>`}
function totalWithdrawn(name){return state.withdrawals.filter(w=>w.user===name&&w.status!=="Rejected").reduce((a,w)=>a+w.amount,0)}

/* ── Tables ── */
function activityTable(name){let rows=state.withdrawals.filter(w=>w.user===name);return `<div class="table-wrap"><table class="table"><tr><th>Reference</th><th>Amount</th><th>Status</th><th>Date</th></tr>${rows.map(w=>`<tr><td>${w.id}</td><td>${peso(w.amount)}</td><td>${badge(w.status)}</td><td>${w.date}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No activity yet.</td></tr>`}</table></div>`}
function badge(s){return `<span class="badge ${s}">${s}</span>`}
function withdrawTable(limit=20,rows=state.withdrawals){return `<div class="table-wrap"><table class="table"><tr><th>Reference</th><th>Member</th><th>Amount</th><th>GCash</th><th>Status</th><th>Date</th><th></th></tr>${rows.slice(0,limit).map(w=>`<tr><td>${w.id}</td><td>${w.user}</td><td><b>${peso(w.amount)}</b></td><td>${w.gcash}</td><td>${badge(w.status)}</td><td>${w.date}</td><td>${state.user.role==="Admin"&&w.status==="Pending"?`<button class="btn btn-primary" style="padding:6px 12px;font-size:12px" onclick="pay('${w.id}')">Mark Paid</button>`:""}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">No withdrawal records.</td></tr>`}</table></div>`}
function loadTable(limit=20,userName=null){let rows=state.loads.filter(x=>!userName||x.user===userName).slice(0,limit);return `<div class="table-wrap"><table class="table"><tr><th>Reference</th><th>Member</th><th>Amount</th><th>Date</th></tr>${rows.map(x=>`<tr><td>${x.id}</td><td>${x.user}</td><td><b>${peso(x.amount)}</b></td><td>${x.date}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No wallet loads.</td></tr>`}</table></div>`}

/* ── Pages ── */
function withdrawals(){let rows=state.user.role==="Admin"?state.withdrawals:state.withdrawals.filter(w=>w.user===state.user.name);return `<div class="page-head"><div><h1>${state.user.role==="Admin"?"Withdrawals":"Total Withdrawal"}</h1><p>Request and track GCash payouts.</p></div>${state.user.role==="Member"?`<button class="btn btn-primary" onclick="withdrawModal()">Request Withdrawal</button>`:""}</div><div class="card"><div class="notice" style="margin-bottom:15px">Minimum withdrawal is ${peso(300)}. Payout method: GCash.</div>${withdrawTable(30,rows)}</div>`}
function members(){return `<div class="page-head"><div><h1>Members</h1><p>Manage registered Savings Pro members.</p></div><button class="btn btn-primary" onclick="addMember()">Add Member</button></div><div class="card"><div class="table-wrap"><table class="table"><tr><th>Member</th><th>Username</th><th>GCash</th><th>Balance</th><th>Loaded</th><th>Status</th><th></th></tr>${state.users.filter(u=>u.role==="Member").map(u=>`<tr><td><b>${u.name}</b></td><td>${u.username}</td><td>${u.gcash||"—"}</td><td>${peso(u.balance)}</td><td>${peso(u.loaded)}</td><td>${badge(u.status)}</td><td><button class="btn btn-outline" style="padding:6px 12px;font-size:12px;color:var(--orange-dark);border-color:var(--orange)" onclick="loadSpecific('${u.username}')">Load Wallet</button></td></tr>`).join("")}</table></div></div>`}
function loads(){return `<div class="page-head"><div><h1>Wallet Loads</h1><p>Admin-funded savings wallet transactions.</p></div><button class="btn btn-primary" onclick="loadModal()">Load Wallet</button></div><div class="card">${loadTable(50)}</div>`}
function monitoring(){return `<div class="page-head"><div><h1>Monitoring</h1><p>Overview of Savings Pro activity.</p></div></div><div class="stat-cards">${stat("System","Online","Application status","green-ok")}${stat("Members",state.users.filter(u=>u.role==="Member").length,"Active accounts")}${stat("Pending",state.withdrawals.filter(w=>w.status==="Pending").length,"Withdrawal requests","amber")}${stat("GCash","Enabled","Payout method")}</div><div class="card mt"><h3>System Notes</h3><div class="summary">${srow("Wallet model","Admin loaded")}${srow("Withdrawal method","GCash")}${srow("Minimum withdrawal",peso(300))}${srow("Commission levels","None")}</div></div>`}
function profile(){return `<div class="page-head"><div><h1>${state.user.role==="Admin"?"My Profile":"My Profile"}</h1><p>Update your account and GCash information.</p></div></div><div class="profile-grid"><div class="card"><h3>Profile Details</h3><div class="field"><label>FULL NAME</label><input id="pName" value="${state.user.name}"></div><div class="field"><label>USERNAME</label><input value="${state.user.username}" disabled></div><div class="field"><label>GCASH NUMBER</label><input id="pGcash" value="${state.user.gcash||""}" placeholder="09XXXXXXXXX"></div><button class="btn btn-primary" onclick="saveProfile()">Save Changes</button></div><div class="card"><h3>Account</h3><div class="summary">${srow("Role",state.user.role)}${srow("Status",state.user.status)}${srow("Joined",state.user.joined)}${srow("Available balance",peso(state.user.balance))}</div></div></div>`}

/* ── Modals ── */
function modal(content){return `<div class="modal-bg" id="modal"><div class="modal">${content}</div></div>`}
function loadModal(user){let m=user||state.users.find(u=>u.role==="Member");if(!m)return;document.body.insertAdjacentHTML("beforeend",modal(`<div class="modal-head"><h2>Load Wallet</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Add savings directly to a member's wallet.</p><div class="field"><label>MEMBER</label><select id="loadUser">${state.users.filter(u=>u.role==="Member").map(u=>`<option value="${u.username}" ${u.username===m.username?"selected":""}>${u.name} — ${u.username}</option>`).join("")}</select></div><div class="field"><label>AMOUNT</label><input id="loadAmount" type="number" min="1" placeholder="0"></div><button class="btn btn-primary" style="width:100%" onclick="submitLoad()">Load Wallet</button>`))}
function withdrawModal(){document.body.insertAdjacentHTML("beforeend",modal(`<div class="modal-head"><h2>Request Withdrawal</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Withdraw to your registered GCash number.</p><div class="notice">Available balance: <b>${peso(state.user.balance)}</b><br>Minimum withdrawal: <b>${peso(300)}</b></div><div class="field" style="margin-top:14px"><label>AMOUNT</label><input id="wdAmount" type="number" min="300" max="${state.user.balance}" placeholder="300"></div><button class="btn btn-primary" style="width:100%" onclick="submitWithdrawal()">Submit Request</button>`))}
function closeModal(){document.getElementById("modal")?.remove()}

/* ── Actions ── */
function submitLoad(){let u=state.users.find(x=>x.username===document.getElementById("loadUser").value),a=Number(document.getElementById("loadAmount").value);if(!u||!a||a<=0){toast("Enter a valid amount.");return}u.balance+=a;u.loaded+=a;state.loads.unshift({id:"LD-"+(1001+state.loads.length),user:u.name,amount:a,date:new Date().toISOString().slice(0,10)});save();closeModal();render();toast(`${peso(a)} loaded to ${u.name}.`)}
function submitWithdrawal(){let a=Number(document.getElementById("wdAmount").value);if(a<300||a>state.user.balance){toast("Enter a valid withdrawal amount.");return}let u=state.users.find(x=>x.id===state.user.id);u.balance-=a;state.user=u;state.withdrawals.unshift({id:"WD-"+(1001+state.withdrawals.length),user:u.name,amount:a,gcash:u.gcash,status:"Pending",date:new Date().toISOString().slice(0,10)});save();closeModal();render();toast("Withdrawal request submitted.")}
function pay(id){let w=state.withdrawals.find(x=>x.id===id);if(w){w.status="Paid";save();render();toast("Withdrawal marked as paid.")}}
function addMember(){let n=prompt("Full name:");if(!n)return;let u=prompt("Username:",n.toLowerCase().replace(/\s+/g,""));if(!u)return;let g=prompt("GCash number:","09");if(!g)return;if(state.users.some(x=>x.username===u)){toast("Username already exists.");return}state.users.push({id:Math.max(...state.users.map(x=>x.id))+1,name:n,username:u,password:"demo",role:"Member",balance:0,loaded:0,gcash:g,status:"Active",joined:new Date().toISOString().slice(0,10)});save();render();toast("Member created.")}
function loadSpecific(u){loadModal(state.users.find(x=>x.username===u))}
function saveProfile(){let u=state.users.find(x=>x.id===state.user.id);u.name=document.getElementById("pName").value.trim()||u.name;u.gcash=document.getElementById("pGcash").value.trim();state.user=u;save();render();toast("Profile updated.")}
function loginAction(){let u=document.getElementById("loginUser").value.trim(),p=document.getElementById("loginPass").value,found=state.users.find(x=>x.username===u&&x.password===p);if(!found){document.getElementById("loginError").style.display="block";return}state.user=found;state.page="Dashboard";render();toast("Welcome to Savings Pro.")}
function registerAction(){let u=document.getElementById("rUser").value.trim(),p=document.getElementById("rPass").value,p2=document.getElementById("rPass2").value;if(p!==p2){document.getElementById("regError").style.display="block";return}if(state.users.some(x=>x.username===u)){toast("Username already exists.");return}let name=u.charAt(0).toUpperCase()+u.slice(1);let m={id:Math.max(...state.users.map(x=>x.id))+1,name:name,username:u,password:p,role:"Member",balance:0,loaded:0,gcash:"",status:"Active",joined:new Date().toISOString().slice(0,10)};state.users.push(m);state.user=m;state.page="Dashboard";save();render();toast("Account created successfully.")}
function logout(){state.user=null;state.page="Landing";render()}
function go(p){if(p==="Landing"||p==="Login"||p==="Register"){state.user=null;state.page=p}else{state.page=p}render()}
function render(){let r=document.getElementById("root");r.innerHTML=state.page==="Landing"?landing():state.page==="Login"?login():state.page==="Register"?register():state.user?appShell():login()}
load();render();
</script>
</body>
</html>
